name: VIRiONT2_main
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Dépendances de base du pipeline ---
  - python=3.12
  - git
  - hostile=2.0.2      # <--- Ajouté ici (version exacte de Bioconda)
  - chopper=0.13.0
  - minimap2=2.31
  - samtools=1.24
  - blast=2.17.0
  - muscle>=5.3
  - seqkit=2.13.0
  - seqtk=1.5
  - bedtools=2.31.1
  - htslib>=1.24

  # --- Dépendances requises pour Amplicon_sorter ---
  - python-edlib
  - biopython
  - matplotlib

  # --- Alignement Multiple & Phylogénie (IQ-TREE 3.1.3) ---
  - mafft>=7.520
  - iqtree=3.1.3

  # --- Dépendances R pour métrologie & génération d'arbres ---
  - r-base>=4.3
  - r-ggplot2
  - r-gridextra
  - r-ape
  - r-phangorn