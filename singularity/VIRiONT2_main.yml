name: VIRiONT2_main
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Dépendances de base du pipeline ---
  - python=3.12
  - git
  - chopper=0.13.0
  - minimap2=2.31
  - samtools=1.24
  - blast=2.17.0
  - muscle>=5.3
  - seqkit=2.13.0
  - seqtk=1.5
