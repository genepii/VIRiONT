name: VIRiONT2_main
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Dépendances de base ---
  - python=3.11
  - pip
  - git
  - hostile
  - chopper
  - minimap2
  - samtools
  - blast
  - muscle>=5.3
  - seqkit
  - seqtk
  - bedtools
  - htslib

  # --- Contrôle Qualité (QC ONT) ---
  - nanoplot
  - mosdepth

  # --- Consensus De-novo & Polissage ---
  - medaka
  - spoa
  - miniasm
  - racon

  # --- Amplicon_sorter ---
  - python-edlib
  - biopython
  - matplotlib

  # --- Phylogénie ---
  - mafft>=7.520
  - iqtree

  # --- R ---
  - r-base>=4.3
  - r-ggplot2
  - r-gridextra
  - r-ape
  - r-phangorn

  # --- Paquets Python gérés par PIP ---
  - pip:
    - pod5
    - toulligqc